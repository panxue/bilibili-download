name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync
        env:
          # Override .python-version to test each matrix version
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check backend/

      - name: Test
        run: uv run pytest

  docker-publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      # Register QEMU so buildx can cross-build linux/arm64 on the amd64 runner
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read app version
        id: version
        run: |
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bilibili-download:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bilibili-download:${{ steps.version.outputs.version }}

      - name: Sync Docker Hub overview from README
        run: |
          JWT=$(curl -sS -X POST https://hub.docker.com/v2/users/login \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$DOCKERHUB_USERNAME\",\"password\":\"$DOCKERHUB_TOKEN\"}" \
            | jq -r .token)
          jq -Rs '{full_description:.}' README.md > /tmp/overview.json
          curl -sS -X PATCH "https://hub.docker.com/v2/repositories/$DOCKERHUB_USERNAME/bilibili-download/" \
            -H "Authorization: JWT $JWT" -H "Content-Type: application/json" \
            --data @/tmp/overview.json
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}