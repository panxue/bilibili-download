name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync
        env:
          # CI runner is overseas; override the Tsinghua index pinned in pyproject.toml, use default PyPI
          UV_DEFAULT_INDEX: https://pypi.org/simple
          # Override .python-version to test each matrix version
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check backend/

      - name: Test
        run: uv run pytest